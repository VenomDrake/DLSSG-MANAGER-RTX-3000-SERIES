name: Build and test Windows app
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.Version
          $label = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.PrereleaseLabel
          $expected = "v$version" + $(if ($label) { "-$label" } else { '' })
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Release tag, version and prerelease label must match." }
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build portable and installer
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DLSSG-Mod-Manager-win-x64
          path: |
            artifacts/DLSSGModManager-Portable-win-x64.zip
            artifacts/DLSSGModManager-Setup.msi
            artifacts/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DLSSG-Mod-Manager-win-x64
          path: artifacts
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "DLSSG Mod Manager $env:GITHUB_REF_NAME", '--notes-file', 'RELEASE_NOTES.md')
          if ($env:GITHUB_REF_NAME -match '^v?\d+\.\d+\.\d+-') { $releaseArgs += @('--prerelease', '--latest=false') }
          else { $releaseArgs += '--latest' }
          $releaseArgs += @('artifacts/DLSSGModManager-Portable-win-x64.zip', 'artifacts/DLSSGModManager-Setup.msi', 'artifacts/SHA256SUMS.txt')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
